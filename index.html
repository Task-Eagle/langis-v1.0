<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Langis | Future Chat</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- For .ico files -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #00f2ff;
            --primary-glow: rgba(0, 242, 255, 0.4);
            --accent-color: #bd00ff;
            --glass-bg: rgba(20, 20, 30, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --glass-highlight: rgba(255, 255, 255, 0.05);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.6);
            --msg-sent: linear-gradient(135deg, #00f2ff 0%, #0077ff 100%);
            --msg-received: rgba(255, 255, 255, 0.1);
            --shadow-soft: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            --blur-amount: 20px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0f0c29;
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            color: var(--text-primary);
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            font-size: 16px;
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(118, 75, 162, 0.2), transparent 60%),
                        radial-gradient(circle at 20% 80%, rgba(0, 242, 255, 0.15), transparent 50%);
            animation: bgMove 20s infinite linear;
            z-index: -1;
            pointer-events: none;
        }

        @keyframes bgMove {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #app {
            display: flex;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
        }

        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(var(--blur-amount));
            -webkit-backdrop-filter: blur(var(--blur-amount));
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow-soft);
        }

        /* SIDEBAR - Fixed height issue */
        .sidebar {
            width: 380px;
            display: flex;
            flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            z-index: 10;
            height: 100%;
            border-right: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid var(--glass-border);
            background: rgba(20, 20, 30, 0.8);
            flex-shrink: 0;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid transparent;
            border-radius: 16px;
            padding: 12px 16px;
            color: var(--text-primary);
            flex: 1;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .search-bar:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--primary-color);
            outline: none;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            min-height: 0; /* Important for flex child scrolling */
        }

        .contact {
            display: flex;
            align-items: center;
            padding: 16px;
            margin-bottom: 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .contact:hover {
            background: var(--glass-highlight);
        }

        .contact.active {
            background: rgba(0, 242, 255, 0.15);
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
            margin-right: 16px;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 600;
            margin-bottom: 4px;
            font-size: 16px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-preview {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* CHAT CONTAINER - Fixed layout */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            min-width: 0;
        }

        .chat-header {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            z-index: 5;
            background: rgba(20, 20, 30, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }

        .back-btn {
            display: none;
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 28px;
            margin-right: 16px;
            cursor: pointer;
            padding: 0;
            transition: transform 0.2s;
            flex-shrink: 0;
        }
        
        .back-btn:active { transform: scale(0.9); }

        .chat-avatar {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            margin-right: 14px;
            box-shadow: 0 4px 12px rgba(0,114,255,0.3);
            flex-shrink: 0;
        }

        .chat-info {
            flex: 1;
            min-width: 0;
        }
        
        .chat-name { 
            font-weight: 700; 
            font-size: 16px; 
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .chat-status { 
            color: var(--primary-color); 
            font-size: 12px; 
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .chat-status::before {
            content: '';
            width: 6px; height: 6px;
            background: var(--primary-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--primary-color);
        }

        /* MESSAGES CONTAINER - Properly fills space */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
            min-height: 0; /* Critical for flex layout */
        }

        .messages-container::-webkit-scrollbar { width: 6px; }
        .messages-container::-webkit-scrollbar-track { background: transparent; }
        .messages-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .message {
            max-width: 75%;
            padding: 12px 18px;
            border-radius: 22px;
            font-size: 15px;
            line-height: 1.5;
            position: relative;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            word-wrap: break-word;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .message.sent {
            background: var(--msg-sent);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            color: #000;
            font-weight: 500;
        }

        .message.received {
            background: var(--msg-received);
            border: 1px solid var(--glass-border);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            color: var(--text-primary);
        }

        .message-time {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 6px;
            text-align: right;
            font-weight: 600;
        }

        /* INPUT CONTAINER - Stays at bottom */
        .message-input-container {
            padding: 16px 20px;
            background: rgba(20, 20, 30, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
            flex-shrink: 0;
        }

        .message-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 14px 20px;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            max-height: 120px;
            line-height: 1.4;
            outline: none;
            transition: all 0.3s;
            overflow-y: auto;
        }

        .message-input:focus {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(0, 242, 255, 0.3);
            box-shadow: 0 0 15px rgba(0, 242, 255, 0.1);
        }

        .send-btn {
            background: var(--primary-color);
            border: none;
            border-radius: 50%;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            flex-shrink: 0;
            box-shadow: 0 0 20px var(--primary-glow);
            color: #000;
        }

        .send-btn:disabled {
            opacity: 0.4;
            box-shadow: none;
            cursor: not-allowed;
            background: #555;
        }

        .send-btn:not(:disabled):hover {
            transform: scale(1.1) rotate(-10deg);
        }

        .send-btn svg {
            width: 20px;
            height: 20px;
            fill: #000;
            margin-left: 2px;
        }

        /* LOGIN SCREEN */
        .login-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #0f0c29;
            background: linear-gradient(to bottom, #24243e, #302b63, #0f0c29);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
            text-align: center;
        }

        .logo {
            width: 90px;
            height: 90px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 32px;
                        transform: rotate(45deg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .logo-inner {
            transform: rotate(-45deg);
            width: 50px; height: 50px;
            background: var(--primary-color);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 20px var(--primary-glow);
        }
        .logo svg { width: 32px; height: 32px; fill: #000; }

        .login-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(to right, #fff, #00f2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            margin-bottom: 40px;
            font-size: 16px;
        }

        .google-btn {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 14px 32px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .google-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
            border-color: var(--primary-color);
        }

        /* SETTINGS MODAL */
        .settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .settings-content {
            background: rgba(20, 20, 30, 0.9);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            padding: 28px;
            border-radius: 24px;
            width: 90%;
            max-width: 340px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .color-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin: 24px 0;
        }

        .color-option {
            width: 100%;
            padding-bottom: 100%;
            height: 0;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
            transition: transform 0.2s;
        }
        .color-option:hover { transform: scale(1.1); }
        .color-option.selected { border-color: white; box-shadow: 0 0 15px rgba(255,255,255,0.5); }

        .close-settings {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            border: none;
            border-radius: 14px;
            color: #000;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .close-settings:hover { opacity: 0.9; }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
            opacity: 0.6;
            min-height: 200px;
        }
        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 20px;
            fill: var(--text-secondary);
            opacity: 0.5;
        }

        /* MOBILE RESPONSIVE */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                width: 100%;
                transform: translateX(0);
                border-right: none;
                box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            }

            .sidebar.hidden {
                transform: translateX(-100%);
            }

            .chat-container {
                width: 100%;
                position: absolute;
                left: 0; top: 0; bottom: 0;
                right: 0;
            }

            .back-btn { display: block; }
            
            .message { max-width: 85%; }
        }
    </style>
</head>

    <!-- Login Screen -->

                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L3.16 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>

                <div class="chat-info">

            </div>

                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>

    <!-- Settings Modal -->

        const closeSettings = document.getElementById('closeSettings');
        const searchBar = document.getElementById('searchBar');
        const colorOptions = document.querySelectorAll('.color-option');

        // --- Core Logic ---

        function init() {
            // Auth State Listener
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    // Update user presence in database
                    db.ref('users/' + user.uid).set({
                        uid: user.uid,
                        name: user.displayName || 'Anonymous User',
                        photoURL: user.photoURL || '',
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                    showApp();
                    syncUsersDirectory();
                } else {
                    showLogin();
                }
            });

            // Event Listeners
            googleLoginBtn.addEventListener('click', () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                auth.signInWithPopup(provider).catch(err => console.error("Login failed", err));
            });

            backBtn.addEventListener('click', () => {
                sidebar.classList.remove('hidden');
                currentChat = null;
                // Reset UI to empty state if we go back
                messagesContainer.innerHTML = '';
                messagesContainer.appendChild(emptyState);
                emptyState.style.display = 'flex';
                chatName.textContent = 'Select a chat';
                chatStatus.textContent = '';
                chatAvatar.textContent = '?';
            });

            sendBtn.addEventListener('click', sendMessage);
            
            // Input Auto-resize & Validation
            messageInput.addEventListener('input', () => {
                sendBtn.disabled = !messageInput.value.trim();
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
            });

            // Send on Enter (desktop & mobile), Shift+Enter for new line
            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            // Settings
            settingsBtn.addEventListener('click', () => settingsModal.style.display = 'flex');
            closeSettings.addEventListener('click', () => settingsModal.style.display = 'none');
            
            // Theme Switcher
            colorOptions.forEach(opt => {
                opt.addEventListener('click', () => {
                    colorOptions.forEach(o => o.classList.remove('selected'));
                    opt.classList.add('selected');
                    const bgType = opt.getAttribute('data-bg');
                    applyTheme(bgType);
                });
            });

            // Search Filter
            searchBar.addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                const filtered = contacts.filter(c => c.name.toLowerCase().includes(term));
                renderContacts(filtered);
            });
        }

        function applyTheme(type) {
            const body = document.body;
            if (type === 'cosmic') {
                body.style.background = 'linear-gradient(to bottom, #24243e, #302b63, #0f0c29)';
            } else if (type === 'deep-ocean') {
                body.style.background = 'linear-gradient(135deg, #141E30, #243B55)';
            } else if (type === 'metallic') {
                body.style.background = 'linear-gradient(45deg, #232526, #414345)';
            } else if (type === 'void') {
                body.style.background = 'linear-gradient(to right, #434343, #000000)';
            }
        }

        function showLogin() { 
            loginScreen.style.display = 'flex'; 
            appContainer.style.display = 'none'; 
            sidebar.classList.remove('hidden'); 
        }
        function showApp() { 
            loginScreen.style.display = 'none'; 
            appContainer.style.display = 'flex'; 
        }

        // Chat Room ID Generator (Alphabetical sort ensures unique ID for pair)
        function getChatRoomId(uid1, uid2) {
            return uid1 < uid2 ? `chat_${uid1}_${uid2}` : `chat_${uid2}_${uid1}`;
        }

        function syncUsersDirectory() {
            // Listen for changes in the users database
            db.ref('users').on('value', (snapshot) => {
                const users = snapshot.val() || {};
                contacts = Object.values(users)
                    .filter(u => u.uid !== currentUser.uid)
                    .map(u => ({
                        id: u.uid,
                        name: u.name || 'Unknown User',
                        avatar: (u.name || '?').charAt(0).toUpperCase(),
                        lastMessage: 'Tap to chat',
                    }));
                renderContacts(contacts);
            });
        }

        function renderContacts(list) {
            contactsList.innerHTML = '';
            if (list.length === 0) {
                contactsList.innerHTML = '<div class="empty-state" style="padding:20px; min-height:0;"><p>No contacts found</p></div>';
                return;
            }
            list.forEach(c => {
                const el = document.createElement('div');
                el.className = 'contact';
                if(currentChat && currentChat.id === c.id) el.classList.add('active');
                
                el.innerHTML = `
                    <div class="avatar">${escapeHtml(c.avatar)}</div>
                    <div class="contact-info">
                        <div class="contact-name">${escapeHtml(c.name)}</div>
                        <div class="contact-preview">${escapeHtml(c.lastMessage)}</div>
                    </div>
                `;
                el.addEventListener('click', () => selectContact(c));
                contactsList.appendChild(el);
            });
        }

        function selectContact(contact) {
            currentChat = contact;
            chatName.textContent = contact.name;
            chatAvatar.textContent = contact.avatar;
            chatStatus.textContent = "Connected";
            emptyState.style.display = 'none';
            
            // Mobile UX: Hide sidebar
            if (window.innerWidth <= 768) sidebar.classList.add('hidden');
            
            // Update active state in list
            document.querySelectorAll('.contact').forEach(el => el.classList.remove('active'));
            
            const roomId = getChatRoomId(currentUser.uid, contact.id);
            listenForMessages(roomId);
        }

        function listenForMessages(roomId) {
            if (activeMessagesQuery) activeMessagesQuery.off(); // Detach old listener
            messagesContainer.innerHTML = '';

            activeMessagesQuery = db.ref('messages/' + roomId).orderByChild('timestamp');
            
            activeMessagesQuery.on('value', (snapshot) => {
                messagesContainer.innerHTML = '';
                const data = snapshot.val();
                
                if (!data) {
                    messagesContainer.innerHTML = `
                        <div class="empty-state" style="opacity:0.4; min-height:0;">
                            <h3>Say Hello! 👋</h3>
                            <p>Start the conversation.</p>
                        </div>`;
                    return;
                }

                const msgs = Object.values(data);
                msgs.forEach(msg => {
                    const msgDiv = document.createElement('div');
                    const isSent = msg.uid === currentUser.uid;
                    msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
                    
                    const time = new Date(msg.timestamp);
                    const timeStr = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    
                    msgDiv.innerHTML = `
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        <div class="message-time">${timeStr}</div>
                    `;
                    messagesContainer.appendChild(msgDiv);
                });
                
                // Smooth scroll to bottom
                setTimeout(() => {
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                }, 50);
            });
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentChat) return;

            const roomId = getChatRoomId(currentUser.uid, currentChat.id);
            const payload = {
                text: text,
                uid: currentUser.uid,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            db.ref('messages/' + roomId).push(payload).then(() => {
                messageInput.value = '';
                sendBtn.disabled = true;
                messageInput.style.height = 'auto';
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, "&amp;")
                      .replace(/</g, "&lt;")
                      .replace(/>/g, "&gt;")
                      .replace(/"/g, "&quot;")
                      .replace(/'/g, "&#039;");
        }

        // Start the app
        window.addEventListener('load', init);
    </script>
</body>
</html>
