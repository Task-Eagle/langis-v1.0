<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Langis</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary-color: #3b82f6;
            --primary-dark: #2563eb;
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-tertiary: #333333;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --border-color: #444444;
            --message-sent: #3b82f6;
            --message-received: #333333;
            --input-bg: #2a2a2a;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            height: -webkit-fill-available; /* Fixes iOS Safari Safari Viewport bug */
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #app {
            display: flex;
            height: 100vh;
            height: -webkit-fill-available;
            width: 100vw;
            position: relative;
        }

        /* Sidebar */
        .sidebar {
            width: 380px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 5;
        }

        .sidebar-header {
            padding: 16px;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .search-bar {
            background: var(--bg-primary);
            border: none;
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--text-primary);
            flex: 1;
            font-size: 14px;
        }

        .search-bar:focus {
            outline: 2px solid var(--primary-color);
        }

        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }

        .contact {
            display: flex;
            align-items: center;
            padding: 14px 16px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid rgba(68, 68, 68, 0.3);
        }

        .contact:hover {
            background: var(--bg-tertiary);
        }

        .contact.active {
            background: rgba(59, 130, 246, 0.2);
            border-left: 4px solid var(--primary-color);
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 15px;
            margin-right: 12px;
            flex-shrink: 0;
        }

        .contact-info {
            flex: 1;
            min-width: 0;
        }

        .contact-name {
            font-weight: 500;
            margin-bottom: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .contact-preview {
            color: var(--text-secondary);
            font-size: 13px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Chat Area */
        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-primary);
            height: 100%;
        }

        .chat-header {
            padding: 14px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            z-index: 2;
        }

        .back-btn {
            display: none;
            background: none;
            border: none;
            color: var(--primary-color);
            font-size: 24px;
            margin-right: 12px;
            cursor: pointer;
            padding: 4px 8px;
            font-weight: bold;
        }

        .chat-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            margin-right: 12px;
        }

        .chat-info {
            flex: 1;
        }

        .chat-name {
            font-weight: 600;
            font-size: 15px;
        }

        .chat-status {
            color: var(--text-secondary);
            font-size: 11px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }

        .message.sent {
            background: var(--message-sent);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.received {
            background: var(--message-received);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            text-align: right;
        }

        .message-input-container {
            padding: 12px 16px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            align-items: center;
            padding-bottom: calc(12px + env(safe-area-inset-bottom)); /* Dynamic iOS notch styling */
        }

        .message-input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 10px 16px;
            color: var(--text-primary);
            font-size: 15px;
            resize: none;
            max-height: 100px;
            font-family: inherit;
            outline: none;
        }

        .message-input:focus {
            border-color: var(--primary-color);
        }

        .send-btn {
            background: var(--primary-color);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: white;
            transform: translateX(1px);
        }

        /* Login Screen */
        .login-screen {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 24px;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: var(--primary-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        }

        .logo svg {
            width: 40px;
            height: 40px;
            fill: white;
        }

        .login-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: var(--text-secondary);
            margin-bottom: 32px;
            text-align: center;
        }

        .google-btn {
            background: white;
            color: #1a1a1a;
            border: none;
            border-radius: 24px;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--shadow);
        }

        /* Settings UI */
        .settings-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 4px;
        }

        .settings-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .settings-content {
            background: var(--bg-secondary);
            padding: 24px;
            border-radius: 16px;
            width: 90%;
            max-width: 360px;
        }

        .color-options {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .color-option {
            width: 100%;
            padding-bottom: 100%;
            height: 0;
            border-radius: 50%;
            cursor: pointer;
            border: 3px solid transparent;
        }

        .color-option.selected {
            border-color: white;
        }

        .close-settings {
            width: 100%;
            padding: 12px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-state {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            text-align: center;
            padding: 40px;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        /* Mobile Responsive Layers */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0; top: 0; bottom: 0;
                width: 100%;
                transform: translateX(0);
            }

            .sidebar.hidden {
                transform: translateX(-100%);
            }

            .chat-container {
                width: 100%;
                position: absolute;
                left: 0; top: 0; bottom: 0;
                right: 0;
            }

            .back-btn {
                display: block;
            }
        }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="logo">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <h1 class="login-title">Langis</h1>
        <p class="login-subtitle">Open alternative casual messaging</p>
        <button id="googleLoginBtn" class="google-btn">
            <svg style="width:20px;height:20px" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 9.03 1 6.54 2.09 4.72 4.41l2.85 2.22.81.62c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Sign in with Google
        </button>
    </div>

    <div id="app" style="display: none;">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <input type="text" class="search-bar" placeholder="Search contacts..." id="searchBar">
                <button class="settings-btn" id="settingsBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L3.16 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
                </button>
            </div>
            <div class="contacts-list" id="contactsList"></div>
        </div>

        <div class="chat-container">
            <div class="chat-header">
                <button class="back-btn" id="backBtn">←</button>
                <div class="chat-avatar" id="chatAvatar">?</div>
                <div class="chat-info">
                    <div class="chat-name" id="chatName">Select a chat</div>
                    <div class="chat-status" id="chatStatus"></div>
                </div>
            </div>

            <div class="messages-container" id="messagesContainer">
                <div class="empty-state" id="emptyState">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    <h3>No Active Chat</h3>
                    <p>Pick someone from the sidebar menu to start exchanging messages.</p>
                </div>
            </div>

            <div class="message-input-container">
                <textarea class="message-input" id="messageInput" placeholder="Message..." rows="1"></textarea>
                <button class="send-btn" id="sendBtn" disabled>
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="settings-modal" id="settingsModal">
        <div class="settings-content">
            <h2 style="font-size: 18px; font-weight: 600;">Chat Background</h2>
            <div class="color-options" id="colorOptions">
                <div class="color-option selected" style="background: #1a1a1a;" data-bg="#1a1a1a"></div>
                <div class="color-option" style="background: #1e293b;" data-bg="#1e293b"></div>
                <div class="color-option" style="background: #0f172a;" data-bg="#0f172a"></div>
                <div class="color-option" style="background: #14532d;" data-bg="#14532d"></div>
            </div>
            <button class="close-settings" id="closeSettings">Done</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBb0guuO6wS1O1-J-4c8rXpO2INfyG4IW4",
            authDomain: "langis-v1.firebaseapp.com",
            databaseURL: "https://langis-v1-default-rtdb.firebaseio.com",
            projectId: "langis-v1",
            storageBucket: "langis-v1.firebasestorage.app",
            messagingSenderId: "966605793820",
            appId: "1:966605793820:web:191c414fccb4ccd2af4dd9"
        };

        let app, auth, db;
        try {
            app = firebase.initializeApp(firebaseConfig);
            auth = firebase.auth();
            db = firebase.database();
        } catch (e) {
            console.error(e);
        }

        let currentUser = null;
        let currentChat = null;
        let activeMessagesQuery = null;
        let contacts = [];

        // DOM elements cache
        const loginScreen = document.getElementById('loginScreen');
        const appContainer = document.getElementById('app');
        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const sidebar = document.getElementById('sidebar');
        const backBtn = document.getElementById('backBtn');
        const contactsList = document.getElementById('contactsList');
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatName = document.getElementById('chatName');
        const chatStatus = document.getElementById('chatStatus');
        const chatAvatar = document.getElementById('chatAvatar');
        const emptyState = document.getElementById('emptyState');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const closeSettings = document.getElementById('closeSettings');
        const searchBar = document.getElementById('searchBar');

        function init() {
            auth.onAuthStateChanged(user => {
                if (user) {
                    currentUser = user;
                    // Register/update user profile in system database
                    db.ref('users/' + user.uid).set({
                        uid: user.uid,
                        name: user.displayName || 'Anonymous User',
                        photoURL: user.photoURL || '',
                        lastSeen: firebase.database.ServerValue.TIMESTAMP
                    });
                    showApp();
                    syncUsersDirectory();
                } else {
                    showLogin();
                }
            });

            googleLoginBtn.addEventListener('click', async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                await auth.signInWithPopup(provider).catch(console.error);
            });

            backBtn.addEventListener('click', () => sidebar.classList.remove('hidden'));
            sendBtn.addEventListener('click', sendMessage);
            
            messageInput.addEventListener('input', () => {
                sendBtn.disabled = !messageInput.value.trim();
                messageInput.style.height = 'auto';
                messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
            });

            messageInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 768) {
                    e.preventDefault();
                    sendMessage();
                }
            });

            settingsBtn.addEventListener('click', () => settingsModal.style.display = 'flex');
            closeSettings.addEventListener('click', () => settingsModal.style.display = 'none');
        }

        function showLogin() { loginScreen.style.display = 'flex'; appContainer.style.display = 'none'; }
        function showApp() { loginScreen.style.display = 'none'; appContainer.style.display = 'flex'; }

        // Secure Room Generation Utility
        function getChatRoomId(uid1, uid2) {
            return uid1 < uid2 ? `chat_${uid1}_${uid2}` : `chat_${uid2}_${uid1}`;
        }

        function syncUsersDirectory() {
            db.ref('users').on('value', (snapshot) => {
                const users = snapshot.val() || {};
                contacts = Object.values(users)
                    .filter(u => u.uid !== currentUser.uid)
                    .map(u => ({
                        id: u.uid,
                        name: u.name,
                        avatar: u.name.charAt(0).toUpperCase(),
                        lastMessage: 'Tap to open conversation',
                    }));
                renderContacts(contacts);
            });
        }

        function renderContacts(list) {
            contactsList.innerHTML = '';
            list.forEach(c => {
                const el = document.createElement('div');
                el.className = 'contact';
                if(currentChat && currentChat.id === c.id) el.className += ' active';
                el.innerHTML = `
                    <div class="avatar">${c.avatar}</div>
                    <div class="contact-info">
                        <div class="contact-name">${escapeHtml(c.name)}</div>
                        <div class="contact-preview">${escapeHtml(c.lastMessage)}</div>
                    </div>
                `;
                el.addEventListener('click', () => selectContact(c));
                contactsList.appendChild(el);
            });
        }

        function selectContact(contact) {
            currentChat = contact;
            chatName.textContent = contact.name;
            chatAvatar.textContent = contact.avatar;
            chatStatus.textContent = "Connected";
            emptyState.style.display = 'none';
            
            if (window.innerWidth <= 768) sidebar.classList.add('hidden');
            
            document.querySelectorAll('.contact').forEach(el => el.classList.remove('active'));
            
            const roomId = getChatRoomId(currentUser.uid, contact.id);
            listenForMessages(roomId);
        }

        function listenForMessages(roomId) {
            if (activeMessagesQuery) activeMessagesQuery.off();
            messagesContainer.innerHTML = '';

            activeMessagesQuery = db.ref('messages/' + roomId).orderByChild('timestamp');
            activeMessagesQuery.on('value', (snapshot) => {
                messagesContainer.innerHTML = '';
                const data = snapshot.val();
                if (!data) {
                    messagesContainer.innerHTML = `<div class="empty-state"><h3>Say Hello! 👋</h3><p>Start your casual chat history below.</p></div>`;
                    return;
                }
                Object.values(data).forEach(msg => {
                    const msgDiv = document.createElement('div');
                    const isSent = msg.uid === currentUser.uid;
                    msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
                    const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    msgDiv.innerHTML = `
                        <div class="message-text">${escapeHtml(msg.text)}</div>
                        <div class="message-time">${timeStr}</div>
                    `;
                    messagesContainer.appendChild(msgDiv);
                });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        function sendMessage() {
            const text = messageInput.value.trim();
            if (!text || !currentChat) return;

            const roomId = getChatRoomId(currentUser.uid, currentChat.id);
            const payload = {
                text: text,
                uid: currentUser.uid,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            };

            db.ref('messages/' + roomId).push().set(payload).then(() => {
                messageInput.value = '';
                sendBtn.disabled = true;
                messageInput.style.height = 'auto';
            });
        }

        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
